database:
  redshift:
    driver: postgres
    # Metric queries + da_squad.agent_guidelines / analysis_runs / feedback (same cluster)
    # Example: host=xxx.redshift.amazonaws.com port=5439 user=... password=... dbname=... sslmode=require
    conn_str: ""

gemini:
  api_key: ""
  model: "gemini-2.0-flash"

slack:
  bot_token: ""
  signing_secret: ""
  channel_id: ""

server:
  listen_addr: ":8080"

analyze:
  query_dir: "queries/goodnight"
  report_date: ""
  workers: 4
  max_rows_per_query: 200
  timezone: Asia/Taipei
  # Empty selects knowledge/<product>/catalog.yaml; "-" disables YAML knowledge.
  knowledge_path: ""
  max_input_tokens: 12000
  max_input_bytes: 60000
  max_knowledge_bytes: 8000
  max_knowledge_items: 12

# 部署設定：deploy.sh 讀這裡（用 yq 解析），與程式執行無關
deploy:
  region: ""                        # 空＝用 aws cli 預設 region
  aws_profile: ""                   # 空＝用預設 profile
  lambda_role: ""                   # 必填：Lambda 執行角色 ARN，例 arn:aws:iam::123456789012:role/da-agents-lambda
  architecture: arm64               # arm64 或 x86_64；腳本會自動對應成 Go 的 GOARCH
  analyze:
    function_name: da-agents-analyze
    timeout: 900                    # 秒；分析可能跑久，給足
    memory_size: 1024
  slack:
    function_name: da-agents-slack
    timeout: 900                    # 背景回放分析；HTTP handler 仍在 3 秒內 ack
    memory_size: 512
